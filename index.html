<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>GRICH | Global Legal Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: { 'terminal-bg': '#0f172a', 'terminal-text': '#34d399', 'danger': '#ef4444' },
            fontFamily: { mono: ['monospace'] }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0f172a; color: #34d399; font-family: monospace; }
      .scan-line { width: 100%; height: 2px; background: rgba(52, 211, 153, 0.5); position: fixed; top: 0; left: 0; animation: scan 3s linear infinite; pointer-events: none; z-index: 50; }
      @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
  </head>
  <body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="scan-line"></div>
    
    <div class="w-full max-w-4xl text-center space-y-8">
      <div class="border-b border-gray-800 pb-4 mb-8">
        <p class="animate-pulse text-sm">● SYSTEM ONLINE :: LIVE MONITORING ACTIVE</p>
      </div>

      <h1 class="text-5xl font-bold tracking-widest text-white mb-4" style="text-shadow: 0 0 15px rgba(52,211,153,0.5);">
        GRICH INTELLIGENCE
      </h1>
      <p class="text-gray-400 text-sm uppercase">Global Risk Compliance Hub</p>

      <div class="max-w-xl mx-auto py-8">
        <div class="bg-gray-900 border border-gray-700 p-4 rounded text-xl text-gray-500 uppercase tracking-widest">
          Enter Case Number...
        </div>
      </div>

      <div class="border border-gray-800 rounded bg-gray-900/50 p-4 text-left">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-gray-500 border-b border-gray-800"><th class="pb-2">RISK</th><th class="pb-2">CASE ID</th><th class="pb-2">TARGET</th></tr>
          </thead>
          <tbody class="divide-y divide-gray-800">
            <tr class="h-12"><td class="text-red-500 font-bold">[99]</td><td class="text-white">24-CV-00891</td><td>Nike, Inc.</td></tr>
            <tr class="h-12"><td class="text-yellow-500 font-bold">[88]</td><td class="text-white">24-CV-00892</td><td>Deckers (UGG)</td></tr>
            <tr class="h-12"><td class="text-green-500 font-bold">[45]</td><td class="text-white">24-CV-00895</td><td>Dyson Ltd.</td></tr>
          </tbody>
        </table>
      </div>
      
      <footer class="pt-12 text-xs text-gray-600 flex justify-center gap-4">
        <a href="/privacy.html" class="hover:text-white">Privacy</a>
        <span>|</span>
        <a href="/terms.html" class="hover:text-white">Terms</a>
        <span>|</span>
        <a href="/refund.html" class="hover:text-white">Refund</a>
      </footer>
    </div>
  </body>
</html>
