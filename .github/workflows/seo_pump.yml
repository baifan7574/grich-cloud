name: Auto SEO Pump (Combat Version)

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时触发一次云端接力
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-relay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Dependencies
        run: npm install @supabase/supabase-js googleapis

      - name: Generate Fresh Sitemap
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/generate_sitemap.js

      - name: Push Sitemap to Cloudflare
        run: |
          git config --global user.name "SEO Bot"
          git config --global user.email "bot@jaxfamlaw.com"
          git add public/sitemap.xml
          git commit -m "chore(seo): auto-update sitemap from local capture [skip ci]" || echo "No changes to commit"
          git push

      - name: Relay to Google Indexing API
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_CONTENT: ${{ secrets.GOOGLE_JSON_KEY }}
        run: |
          # 动态创建密钥文件（如果 secret 是内容）
          echo "$GOOGLE_APPLICATION_CREDENTIALS_CONTENT" > google_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=google_key.json
          node scripts/google_indexing_pump.js
