name: GRICH Data Pumper (Production Zero-Failure)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pump_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 📦 Install Runtime Engine
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv requests
          pip show requests supabase

      - name: 🔍 Environment Pre-check (SKILL 1.0)
        env:
          # 冗余注入：不管老板起什么名字，通通接通
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: |
          echo "Checking Database Credentials..."
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ ERROR: Database Secret not found! Please ensure 'SUPABASE_SERVICE_KEY' is set in GitHub Actions Secrets."
            exit 1
          fi
          # 强制生成 .env 适配所有历史遗留脚本
          echo "PUBLIC_SUPABASE_URL=$URL" > .env
          echo "PUBLIC_SUPABASE_ANON_KEY=$KEY" >> .env
          echo "SUPABASE_URL=$URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$KEY" >> .env
          echo "✅ Env File Synchronized."

      - name: 🚀 Exec Dual-Script Harvest (SKILL 2.0)
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.agent/skills/legal-data-pumper/scripts
        run: |
          set -e
          echo "Starting Master Harvester..."
          python ".agent/skills/legal-data-pumper/scripts/seed_intelligent_2026.py"

          echo "Starting Law Firm Sniper..."
          if [ -f ".agent/skills/legal-data-pumper/scripts/real_sniper_v2.py" ]; then
            python ".agent/skills/legal-data-pumper/scripts/real_sniper_v2.py"
          else
            echo "⚠️ Sniper script not found, skipping."
          fi

      - name: 🏗️ Build Master Sitemap (SKILL 7.0)
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm install fs-extra dotenv @supabase/supabase-js
          # 先运行 build.js 准备基础 dist 目录
          node build.js
          # 再运行真正的 Sitemap 生成器更新数据
          node scripts/generate_sitemap.js

      - name: 🔄 Self-Healing Sync (SKILL 3.0)
        run: |
          git config --global user.name 'Grich Auto-Pumper'
          git config --global user.email 'bot@grich.law'

          # 变基拉取，防止推送锁定
          git pull --rebase origin main

          if [ -f "dist/sitemap.xml" ]; then
            git add dist/sitemap.xml
            if git diff --staged --quiet; then
              echo "No data changes detected."
            else
              git commit -m "chore: auto-harvest legal data update [skip ci]"
              for i in {1..3}; do
                git push origin main && break || (sleep 5 && git pull --rebase origin main)
              done
            fi
          else
            echo "⚠️ Sitemap not found in dist/, skipping push."
          fi
