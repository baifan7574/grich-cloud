name: GRICH Data Pumper (Production Zero-Failure)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pump_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 📦 Install Runtime Engine
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv requests
          pip show requests supabase

      - name: 🔍 Environment Pre-check (SKILL 1.0)
        env:
          # 冗余注入：不管老板起什么名字，通通接通
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: |
          echo "📊 System Diagnostic Report"
          echo "---------------------------"
          if [ -z "$URL" ]; then echo "❌ URL: MISSING"; else echo "✅ URL: PRESENT (${#URL} chars)"; fi
          if [ -z "$KEY" ]; then echo "❌ KEY: MISSING"; else echo "✅ KEY: PRESENT (${#KEY} chars)"; fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "🚨 CRITICAL: Missing required secrets. Please add SUPABASE_URL and SUPABASE_SERVICE_KEY to GitHub Secrets."
            exit 1
          fi

          echo "PUBLIC_SUPABASE_URL=$URL" > .env
          echo "PUBLIC_SUPABASE_ANON_KEY=$KEY" >> .env
          echo "SUPABASE_URL=$URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$KEY" >> .env
          echo "✅ Production Pipeline Primed."

      - name: 🚀 Exec Dual-Script Harvest (SKILL 2.0)
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          echo "🛰️ Launching Court Data Harvester..."
          python ".agent/skills/legal-data-pumper/scripts/seed_intelligent_2026.py" || echo "⚠️ Harvester warning (continued)"

          echo "🎯 Launching Law Firm Sniper..."
          python ".agent/skills/legal-data-pumper/scripts/real_sniper_v2.py" || echo "⚠️ Sniper warning (continued)"

      - name: 🏗️ Build Master Sitemap (SKILL 7.0)
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: |
          npm install fs-extra dotenv @supabase/supabase-js googleapis
          node build.js
          node scripts/generate_sitemap.js || echo "⚠️ Sitemap warning (continued)"
          # 主动向 Google 提交收录请求
          node scripts/submit_google.js || echo "⚠️ Google submission skipped"

      - name: 🔄 Self-Healing Sync (SKILL 3.0)
        run: |
          git config --global user.name 'Grich Auto-Pumper'
          git config --global user.email 'bot@grich.law'

          # 确保 dist 文件夹被识别
          git add -f dist/sitemap.xml || echo "No sitemap to add"

          if git diff --staged --quiet; then
            echo "✅ No data changes detected. System is in sync."
          else
            echo "📝 Changes detected. Committing..."
            git commit -m "chore: auto-harvest legal data update [skip ci]"
            
            # 使用更鲁棒的推送重试机制
            for i in {1..5}; do
              echo "Push attempt $i..."
              git push origin main && break || (echo "Push failed, retrying in 5s..." && sleep 5 && git pull origin main --rebase)
            done
          fi

      - name: 🌐 Deploy to Cloudflare Pages (SKILL 8.0)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c70f291b77fbc02a6f2090ebe4abdd44
          projectName: jaxfamlaw
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
