name: GRICH Data Pumper (Verified SSR Automation)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv requests

      - name: Exec Data Pumper (SOP Chapter 17)
        env:
          PUBLIC_SUPABASE_URL: "https://rdlmumybuwveaaeceohj.supabase.co"
          PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_aPXWTauRxJ88A88mwLDoPQ_puVi7PZj"
        run: |
          # 🎯 物理定位脚本，确保在 Actions 环境中执行
          python .agent/skills/legal-data-pumper/scripts/seed_intelligent_2026.py

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Node Dependencies (Force Install)
        run: |
          npm install fs-extra dotenv @supabase/supabase-js

      - name: Build Assets & Sitemap (SOP Chapter 7)
        run: |
          # 确保 dist 目录存在
          mkdir -p dist
          node build.js

      - name: Commit & Sync (SOP Chapter 8)
        run: |
          git config --global user.name 'Grich Deploy Bot'
          git config --global user.email 'bot@grich.law'
          git add dist/sitemap.xml
          # [skip ci] 防止触发循环构建
          git commit -m "chore: automated seo data harvest [skip ci]" || echo "No changes detected"
          git push origin main
