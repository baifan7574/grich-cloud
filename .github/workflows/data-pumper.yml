name: GRICH Data Pumper (Production Zero-Failure)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pump_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: 📦 Install Runtime Engine
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv requests
          pip show requests supabase

      - name: 🔍 Environment Pre-check (SKILL 1.0)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: |
          echo "📊 System Diagnostic Report"
          echo "---------------------------"
          if [ -z "$URL" ]; then echo "❌ URL: MISSING"; else echo "✅ URL: PRESENT"; fi
          if [ -z "$KEY" ]; then echo "❌ KEY: MISSING"; else echo "✅ KEY: PRESENT"; fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "🚨 CRITICAL: Missing required secrets. Please add SUPABASE_URL and SUPABASE_SERVICE_KEY to GitHub Secrets."
            exit 1
          fi

          echo "PUBLIC_SUPABASE_URL=$URL" >> $GITHUB_ENV
          echo "PUBLIC_SUPABASE_ANON_KEY=$KEY" >> $GITHUB_ENV
          echo "SUPABASE_URL=$URL" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$KEY" >> $GITHUB_ENV

          echo "PUBLIC_SUPABASE_URL=$URL" > .env
          echo "PUBLIC_SUPABASE_ANON_KEY=$KEY" >> .env
          echo "SUPABASE_URL=$URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$KEY" >> .env
          echo "✅ Production Pipeline Primed."

      - name: 🚀 Exec Dual-Script Harvest (SKILL 2.0)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e
          echo "🛰️ Launching Court Data Harvester..."
          python ".agent/skills/legal-data-pumper/scripts/seed_intelligent_2026.py"

          echo "🎯 Launching Law Firm Sniper..."
          python ".agent/skills/legal-data-pumper/scripts/real_sniper_v2.py"

      - name: 🏗️ Build Master Sitemap (SKILL 7.0)
        run: |
          npm install fs-extra dotenv @supabase/supabase-js googleapis
          node build.js
          node scripts/generate_sitemap.js
          # 主动向 Google 提交收录请求
          node scripts/submit_google.js || echo "Skip submission"

      - name: 🔄 Self-Healing Sync (SKILL 3.0)
        run: |
          git config --global user.name 'Grich Auto-Pumper'
          git config --global user.email 'bot@grich.law'

          git add -f dist/sitemap.xml || echo "No sitemap"
          git add -f dist/index.html || echo "No index"

          if git diff --staged --quiet; then
            echo "✅ No data changes detected. System is in sync."
          else
            echo "📝 Changes detected. Committing..."
            git commit -m "chore: auto-harvest legal data update [skip ci]"
            
            for i in {1..5}; do
              echo "Push attempt $i..."
              git push origin main && break || (echo "Push failed, retrying..." && sleep 5 && git pull origin main --rebase)
            done
          fi

      - name: 🌐 Deploy to Cloudflare Pages (SKILL 8.0)
        env:
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c70f291b77fbc02a6f2090ebe4abdd44
        run: |
          echo "🌐 Starting Deployment Diagnostic..."
          if [ ! -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🔐 Auth Mode: Scoped API Token"
            export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN"
            unset CLOUDFLARE_API_KEY
          else
            echo "🔐 Auth Mode: Global API Key"
            export CLOUDFLARE_API_KEY="$CLOUDFLARE_API_KEY"
          fi
          npx wrangler pages deploy dist --project-name=grich-cloud --branch=main --commit-dirty=true
