name: Daily Lawsuit Data Seed

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  seed_database:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Serper Seed Engine
      env:
        # 使用 GitHub Secrets 注入环境变量
        # 注意: 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置这些值
        SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
        PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
      run: |
        # 确保脚本路径正确
        python GRICH/scripts/seed_engine_serper.py
