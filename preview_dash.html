<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRICH Sniper Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="p-10 min-h-screen selection:bg-emerald-500/30">

    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1
                    class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    GRICH 系统预览
                </h1>
                <p class="text-slate-400 mt-2">来自引擎 2 的实时数据 (狙击模式)</p>
            </div>
            <div class="flex gap-4">
                <div class="glass px-6 py-3 rounded-xl text-center">
                    <div class="text-xs text-slate-400 uppercase tracking-wider">总目标</div>
                    <div class="text-3xl font-bold text-white mt-1" id="count-total">-</div>
                </div>
                <div class="glass px-6 py-3 rounded-xl text-center border-emerald-500/30">
                    <div class="text-xs text-slate-400 uppercase tracking-wider">富含</div>
                    <div class="text-3xl font-bold text-emerald-400 mt-1" id="count-enriched">-</div>
                </div>
            </div>
        </div>

        <!-- Lawsuits Overview -->
        <h2 class="flex items-center gap-2 text-xl font-semibold mb-4 text-blue-300">
            <span>🎯</span> 正在进行的诉讼
        </h2>
        <div class="glass rounded-xl overflow-hidden mb-12 shadow-2xl shadow-blue-900/10">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs tracking-wider">
                    <tr>
                        <th class="p-4 font-medium">案件编号</th>
                        <th class="p-4 font-medium">原告</th>
                        <th class="p-4 font-medium">风险评分</th>
                        <th class="p-4 font-medium">来源</th>
                        <th class="p-4 font-medium">证据</th>
                    </tr>
                </thead>
                <tbody id="lawsuit-rows" class="divide-y divide-slate-700/50 text-sm">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-500 animate-pulse">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Defendants Detail -->
        <h2 class="flex items-center gap-2 text-xl font-semibold mb-4 text-emerald-300">
            <span>💀</span> 已确定目标 (被告)
        </h2>
        <div class="glass rounded-xl overflow-hidden shadow-2xl shadow-emerald-900/10">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs tracking-wider">
                    <tr>
                        <th class="p-4 font-medium">ID</th>
                        <th class="p-4 font-medium">店铺名称</th>
                        <th class="p-4 font-medium">平台</th>
                        <th class="p-4 font-medium">直接链接</th>
                        <th class="p-4 font-medium">发现于</th>
                    </tr>
                </thead>
                <tbody id="defendant-rows" class="divide-y divide-slate-700/50 text-sm">
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-500 animate-pulse">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Use a different variable name for the client to avoid shadowing the global 'supabase' object
        const SUPABASE_URL = "https://rdlmumybuwveaaeceohj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_aPXWTauRxJ88A88mwLDoPQ_puVi7PZj";

        // FIX: user 'supabaseClient' instead of 'supabase'
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchData() {
            try {
                // Stats
                const { count: total } = await supabaseClient.from('defendants').select('*', { count: 'exact', head: true });
                document.getElementById('count-total').innerText = total || 0;

                const { count: enriched } = await supabaseClient.from('defendants').select('*', { count: 'exact', head: true }).not('store_url', 'is', null);
                document.getElementById('count-enriched').innerText = enriched || 0;

                // Lawsuits
                const { data: lawsuits } = await supabaseClient.from('lawsuits').select('*').order('created_at', { ascending: false }).limit(5);
                const lawsuitsBody = document.getElementById('lawsuit-rows');

                if (lawsuits && lawsuits.length > 0) {
                    lawsuitsBody.innerHTML = lawsuits.map(r => `
                        <tr class="hover:bg-slate-700/30 transition group">
                            <td class="p-4 font-mono text-blue-400 group-hover:text-blue-300">${r.case_number}</td>
                            <td class="p-4 font-medium text-slate-200">${r.plaintiff}</td>
                            <td class="p-4"><span class="bg-red-500/20 text-red-200 border border-red-500/30 px-2 py-0.5 rounded text-xs font-bold">${r.risk_score}</span></td>
                            <td class="p-4 text-xs text-slate-400">${r.status || 'Active'}</td>
                            <td class="p-4"><a href="${r.raw_data_url}" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-xs uppercase font-bold tracking-wide">View ↗</a></td>
                        </tr>
                    `).join('');
                } else {
                    lawsuitsBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">No active lawsuits found.</td></tr>`;
                }

                // Defendants
                // Prioritize enriched ones
                const { data: defendants } = await supabaseClient
                    .from('defendants')
                    .select('*')
                    .order('store_url', { ascending: false, nullsFirst: false }) // Enriched first
                    .order('found_at', { ascending: false })
                    .limit(50);

                const defBody = document.getElementById('defendant-rows');

                if (defendants && defendants.length > 0) {
                    defBody.innerHTML = defendants.map(r => `
                        <tr class="hover:bg-slate-700/30 transition border-b border-slate-700/50 group">
                            <td class="p-4 font-mono text-slate-500 text-xs">${r.id.split('-')[0]}...</td>
                            <td class="p-4 font-bold text-white group-hover:text-emerald-200 transition-colors">${r.defendant_name}</td>
                            <td class="p-4 text-sm">${r.platform || '<span class="text-slate-600 italic">Scanning...</span>'}</td>
                            <td class="p-4">
                                ${r.store_url
                            ? `<a href="${r.store_url}" target="_blank" class="inline-flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-lg shadow-emerald-900/20">Visit Store ↗</a>`
                            : `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg text-xs font-medium bg-slate-800 text-slate-500"><span class="w-1.5 h-1.5 rounded-full bg-slate-500 animate-pulse"></span> Pending</span>`
                        }
                            </td>
                            <td class="p-4 text-xs text-slate-500 font-mono">${new Date(r.found_at).toLocaleDateString()}</td>
                        </tr>
                    `).join('');
                } else {
                    defBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">No defendants captured yet.</td></tr>`;
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('lawsuit-rows').innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-400">Error loading data: ${err.message}</td></tr>`;
            }
        }

        fetchData();
        setInterval(fetchData, 3000); // 3s refresh
    </script>
</body>

</html>
